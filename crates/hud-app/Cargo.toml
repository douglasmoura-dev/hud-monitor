[package]
name = "hud-app"
version = "0.1.0"
edition = "2021"

[dependencies]
hud-core = { path = "../hud-core" }
thiserror = "2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-winit"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Graphics_Dxgi"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network"] }
serde_json = "1.0.154"
nvml-wrapper = { version = "0.11", default-features = false }

[build-dependencies]
slint-build = "1.18"
