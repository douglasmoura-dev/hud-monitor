[package]
name = "hud-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hud-core = { path = "../hud-core" }
thiserror = "2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-winit", "raw-window-handle-06"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network"] }
serde_json = "1.0.154"
nvml-wrapper = { version = "0.11", default-features = false }
tray-icon = "0.26"
global-hotkey = "0.9"
raw-window-handle = "0.6"
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
slint-build = "1.18"
